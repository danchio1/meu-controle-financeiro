<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão Financeira Pessoal</title>
    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --danger: #ef4444;
            --success: #10b981;
        }

        .dark {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --accent: #3b82f6;
            --accent-hover: #60a5fa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-primary); transition: background-color 0.3s, color 0.3s; padding: 20px; }
        
        /* Modal de Login / Proteção de Senha */
        #loginOverlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.95);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999;
        }
        .login-box {
            background: var(--bg-card);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 360px;
            width: 90%;
        }
        .login-box h2 { margin-bottom: 12px; font-size: 1.3rem; }
        .login-box p { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 20px; }
        .login-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            text-align: center;
            font-size: 1.1rem;
            letter-spacing: 2px;
        }
        .login-box button {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
        .login-box button:hover { background: var(--accent-hover); }

        .container { max-width: 1200px; margin: 0 auto; display: none; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; }
        h1 { font-size: 1.5rem; font-weight: 700; }
        .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        select, button, input { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-primary); font-size: 0.9rem; cursor: pointer; }
        button.btn-primary { background: var(--accent); color: white; border: none; font-weight: 600; }
        button.btn-primary:hover { background: var(--accent-hover); }
        .dashboard-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .card { background: var(--bg-card); padding: 18px; border-radius: 12px; border: 1px solid var(--border-color); }
        .card-title { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 6px; }
        .card-value { font-size: 1.3rem; font-weight: 700; }
        .tabs-container { overflow-x: auto; margin-bottom: 20px; }
        .tabs { display: flex; gap: 8px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
        .tab-btn { background: none; border: none; padding: 8px 14px; border-radius: 6px; color: var(--text-secondary); white-space: nowrap; font-weight: 500; }
        .tab-btn.active { background: var(--accent); color: white; font-weight: 600; }
        
        .table-container { 
            background: var(--bg-card); 
            border-radius: 12px; 
            border: 1px solid var(--border-color); 
            overflow: auto; 
            max-height: 60vh; 
            margin-bottom: 24px; 
        }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.88rem; }
        th, td { padding: 10px 14px; border-bottom: 1px solid var(--border-color); }
        th { 
            position: sticky; top: 0; 
            background: var(--bg-card); 
            color: var(--text-secondary); 
            font-weight: 600; 
            z-index: 10;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .val-entrada { color: var(--success); font-weight: 600; }
        .val-saida { color: var(--danger); }
        .actions-cell { display: flex; gap: 6px; }
        .btn-sm { padding: 4px 8px; font-size: 0.78rem; border-radius: 4px; }
        .btn-edit { background: var(--border-color); }
        .empty-notice { padding: 30px; text-align: center; color: var(--text-secondary); font-size: 0.95rem; }
        @media (max-width: 600px) { body { padding: 10px; } header { flex-direction: column; align-items: flex-start; } }
    </style>
</head>
<body>

    <!-- Tela de Bloqueio por Senha -->
    <div id="loginOverlay">
        <div class="login-box">
            <h2>Acesso Restrito</h2>
            <p>Digite a senha para acessar o controle financeiro:</p>
            <input type="password" id="passInput" placeholder="Senha" onkeypress="if(event.key==='Enter') checkPass()">
            <button onclick="checkPass()">Entrar</button>
        </div>
    </div>

    <!-- Conteúdo Principal do Aplicativo -->
    <div class="container" id="appContent">
        <header>
            <h1>Controle de Bancos & Gastos</h1>
            <div class="controls">
                <select id="yearSelect" onchange="changeYear()"></select>
                <button onclick="addYear()">+ Novo Ano</button>
                <button class="btn-primary" onclick="openAddModal()">+ Lançamento</button>
                <button class="btn-primary" style="background: var(--success);" onclick="document.getElementById('importFile').click()">📂 Importar Backup (JSON)</button>
                <button onclick="exportData()">💾 Exportar Backup (JSON)</button>
                <input type="file" id="importFile" style="display:none" onchange="importData(event)" accept=".json">
                <button onclick="clearAllData()" style="color: var(--danger);">🗑️ Limpar Tudo</button>
                <button onclick="toggleTheme()">🌓 Tema</button>
            </div>
        </header>

        <div class="dashboard-cards">
            <div class="card">
                <div class="card-title">Saldo Final do Mês</div>
                <div class="card-value" id="cardSaldo">R$ 0,00</div>
            </div>
            <div class="card">
                <div class="card-title">Entradas / Rendimentos</div>
                <div class="card-value val-entrada" id="cardEntradas">R$ 0,00</div>
            </div>
            <div class="card">
                <div class="card-title">Saídas / Despesas</div>
                <div class="card-value val-saida" id="cardSaidas">R$ 0,00</div>
            </div>
            <div class="card">
                <div class="card-title">Balanço Líquido</div>
                <div class="card-value" id="cardBalanco">R$ 0,00</div>
            </div>
        </div>

        <div class="tabs-container">
            <div class="tabs" id="monthTabs"></div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Descrição / Histórico</th>
                        <th>Valor (R$)</th>
                        <th>Saldo Resultante</th>
                        <th>Tipo (Manual / Débito / DDA)</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="dataTable"></tbody>
            </table>
        </div>
    </div>

    <script>
        const APP_PASSWORD = "17Junho00!"; // Senha mantida

        function checkPass() {
            const val = document.getElementById('passInput').value;
            if (val === APP_PASSWORD) {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('appContent').style.display = 'block';
                init();
            } else {
                alert("Senha incorreta!");
                document.getElementById('passInput').value = '';
            }
        }

        const months = ['JANEIRO', 'FEVEREIRO', 'MARÇO', 'ABRIL', 'MAIO', 'JUNHO', 'JULHO', 'AGOSTO', 'SETEMBRO', 'OUTUBRO', 'NOVEMBRO', 'DEZEMBRO'];
        let currentYear = 2026;
        let currentMonthIdx = 0;

        // Estrutura padrão zerada
        const emptyData = {
            "2026": {
                "JANEIRO": [], "FEVEREIRO": [], "MARÇO": [], "ABRIL": [],
                "MAIO": [], "JUNHO": [], "JULHO": [], "AGOSTO": [],
                "SETEMBRO": [], "OUTUBRO": [], "NOVEMBRO": [], "DEZEMBRO": []
            }
        };

        // Chave de memória atualizada para ignorar cache antigo
        let db = JSON.parse(localStorage.getItem('finDB_blank_v2')) || emptyData;

        function init() {
            if (!db[currentYear]) {
                db[currentYear] = {};
                months.forEach(m => db[currentYear][m] = []);
            }
            renderYearSelect();
            renderTabs();
            renderData();
        }

        function parseToISO(inputDate) {
            if (!inputDate || inputDate === "Saldo Inicial" || inputDate === "1900-01-01") return "Saldo Inicial";
            let val = String(inputDate).trim();
            if (/^\d{1,2}$/.test(val)) {
                let day = parseInt(val, 10);
                if (day >= 1 && day <= 31) {
                    let mIdx = (currentMonthIdx + 1).toString().padStart(2, '0');
                    let dStr = day.toString().padStart(2, '0');
                    return `${currentYear}-${mIdx}-${dStr}`;
                }
            }
            if (val.includes('/')) {
                let parts = val.split('/');
                if (parts.length === 3) {
                    let d = parts[0].padStart(2, '0');
                    let m = parts[1].padStart(2, '0');
                    let y = parts[2].length === 2 ? '20' + parts[2] : parts[2];
                    return `${y}-${m}-${d}`;
                }
            }
            return val;
        }

        function formatDateBR(isoDate) {
            if (!isoDate || isoDate === "Saldo Inicial" || isoDate === "1900-01-01") return "Saldo Inicial";
            if (isoDate.includes('-')) {
                let parts = isoDate.split('-');
                if (parts.length === 3) {
                    return `${parts[2].padStart(2, '0')}/${parts[1].padStart(2, '0')}/${parts[0]}`;
                }
            }
            return isoDate;
        }

        function recalculateSaldos(monthName) {
            const list = db[currentYear]?.[monthName] || [];
            list.sort((a, b) => {
                if (a.historico === "Saldo Inicial" || a.data === "Saldo Inicial") return -1;
                if (b.historico === "Saldo Inicial" || b.data === "Saldo Inicial") return 1;
                if (!a.data) return -1;
                if (!b.data) return 1;
                return a.data.localeCompare(b.data);
            });

            let currentSaldo = 0;
            list.forEach((item, idx) => {
                const val = parseFloat(item.valor) || 0;
                if (idx === 0 && (item.historico === "Saldo Inicial" || item.data === "Saldo Inicial")) {
                    currentSaldo = item.saldo;
                } else {
                    currentSaldo = currentSaldo - val;
                    item.saldo = currentSaldo;
                }
            });
        }

        function renderYearSelect() {
            const select = document.getElementById('yearSelect');
            select.innerHTML = '';
            const years = Object.keys(db).sort();
            years.forEach(y => {
                const opt = document.createElement('option');
                opt.value = y;
                opt.textContent = y;
                if (y == currentYear) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function renderTabs() {
            const container = document.getElementById('monthTabs');
            container.innerHTML = '';
            months.forEach((m, idx) => {
                const btn = document.createElement('button');
                btn.className = `tab-btn ${idx === currentMonthIdx ? 'active' : ''}`;
                btn.textContent = m;
                btn.onclick = () => {
                    currentMonthIdx = idx;
                    renderTabs();
                    renderData();
                };
                container.appendChild(btn);
            });
        }

        function renderData() {
            const tbody = document.getElementById('dataTable');
            tbody.innerHTML = '';
            const monthName = months[currentMonthIdx];
            
            recalculateSaldos(monthName);
            
            const records = db[currentYear]?.[monthName] || [];

            if (records.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="empty-notice">Nenhum lançamento neste mês. Clique no botão verde <b>📂 Importar Backup (JSON)</b> no topo para carregar os seus dados.</td></tr>`;
                document.getElementById('cardSaldo').textContent = "R$ 0,00";
                document.getElementById('cardEntradas').textContent = "R$ 0,00";
                document.getElementById('cardSaidas').textContent = "R$ 0,00";
                document.getElementById('cardBalanco').textContent = "R$ 0,00";
                return;
            }

            let totalEntradas = 0;
            let totalSaidas = 0;
            let ultimoSaldo = records.length ? records[records.length - 1].saldo : 0;

            records.forEach((rec, i) => {
                const val = parseFloat(rec.valor) || 0;
                if (val < 0) totalEntradas += Math.abs(val);
                else totalSaidas += val;

                const displayDate = formatDateBR(rec.data);
                const isSaldoInicial = rec.historico === "Saldo Inicial" || rec.data === "Saldo Inicial";

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${displayDate}</td>
                    <td>${rec.historico || '-'}</td>
                    <td class="${val < 0 ? 'val-entrada' : (val > 0 ? 'val-saida' : '')}">${val < 0 ? '+ R$ ' + Math.abs(val).toFixed(2) : (val > 0 ? '- R$ ' + val.toFixed(2) : 'R$ 0,00')}</td>
                    <td>R$ ${(parseFloat(rec.saldo)||0).toFixed(2)}</td>
                    <td>${rec.tipo || ''}</td>
                    <td class="actions-cell">
                        ${isSaldoInicial ? '<span style="color: var(--text-secondary); font-size: 0.8rem;">Fixo</span>' : `
                            <button class="btn-sm btn-edit" onclick="editRecord(${i})">Editar</button>
                            <button class="btn-sm" onclick="deleteRecord(${i})">Remover</button>
                        `}
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('cardSaldo').textContent = `R$ ${ultimoSaldo.toFixed(2)}`;
            document.getElementById('cardEntradas').textContent = `R$ ${totalEntradas.toFixed(2)}`;
            document.getElementById('cardSaidas').textContent = `R$ ${totalSaidas.toFixed(2)}`;
            document.getElementById('cardBalanco').textContent = `R$ ${(totalEntradas - totalSaidas).toFixed(2)}`;
        }

        function openAddModal() {
            const currentMonthNum = (currentMonthIdx + 1).toString().padStart(2, '0');
            const defaultPromptDate = `21/${currentMonthNum}/${currentYear}`;

            const dtPrompt = prompt(`Data do registro (ex: 25 para dia 25/${currentMonthNum}/${currentYear} ou DD/MM/AAAA):`, defaultPromptDate);
            if (dtPrompt === null) return;

            const dtParsed = parseToISO(dtPrompt);

            const hist = prompt("Descrição / Histórico:");
            if (!hist) return;

            const valStr = prompt("Valor em R$ (Exemplo: 50 para gasto, -50 para salário/rendimento):");
            if (valStr === null) return;

            let tipoInput = prompt("Escolha o Tipo do Pagamento:\n1 - Manual\n2 - Débito\n3 - DDA\n\n(Digite o número ou o nome da opção):", "1");
            if (tipoInput === null) return;

            let tipo = "Manual";
            let tClean = tipoInput.trim().toLowerCase();
            if (tClean === "2" || tClean === "débito" || tClean === "debito") tipo = "Débito";
            else if (tClean === "3" || tClean === "dda") tipo = "DDA";

            const val = parseFloat(valStr.replace(',', '.')) || 0;
            const monthName = months[currentMonthIdx];

            if (!db[currentYear][monthName]) db[currentYear][monthName] = [];
            db[currentYear][monthName].push({ data: dtParsed, historico: hist, valor: val, saldo: 0, tipo: tipo });
            saveData();
            renderData();
        }

        function editRecord(idx) {
            const monthName = months[currentMonthIdx];
            const item = db[currentYear][monthName][idx];

            const currentDisplayDate = formatDateBR(item.data);
            const newDtPrompt = prompt("Editar Data (digite apenas o dia, ou DD/MM/AAAA):", currentDisplayDate);
            if (newDtPrompt === null) return;

            const newDtParsed = parseToISO(newDtPrompt);

            const newHist = prompt("Editar Descrição / Histórico:", item.historico);
            if (newHist === null) return;

            const newValStr = prompt("Editar Valor em R$ (Negativo para entrada, Positivo para gasto):", item.valor);
            if (newValStr === null) return;

            let defaultVal = "1";
            if (item.tipo === "Débito") defaultVal = "2";
            else if (item.tipo === "DDA") defaultVal = "3";

            let tipoInput = prompt("Escolha o Tipo do Pagamento:\n1 - Manual\n2 - Débito\n3 - DDA\n\n(Digite o número ou o nome da opção):", defaultVal);
            if (tipoInput === null) return;

            let newTipo = "Manual";
            let tClean = tipoInput.trim().toLowerCase();
            if (tClean === "2" || tClean === "débito" || tClean === "debito") newTipo = "Débito";
            else if (tClean === "3" || tClean === "dda") newTipo = "DDA";

            const valParsed = parseFloat(String(newValStr).replace(',', '.')) || 0;

            item.data = newDtParsed;
            item.historico = newHist;
            item.valor = valParsed;
            item.tipo = newTipo;
            saveData();
            renderData();
        }

        function deleteRecord(idx) {
            if (confirm("Deseja remover este registro?")) {
                const monthName = months[currentMonthIdx];
                db[currentYear][monthName].splice(idx, 1);
                saveData();
                renderData();
            }
        }

        function clearAllData() {
            if (confirm("Tem certeza de que deseja apagar todos os dados guardados neste navegador?")) {
                localStorage.clear();
                db = JSON.parse(JSON.stringify(emptyData));
                renderYearSelect();
                renderData();
                alert("Memória local limpa com sucesso!");
            }
        }

        function saveData() {
            try {
                localStorage.setItem('finDB_blank_v2', JSON.stringify(db));
            } catch(e) {}
        }

        function changeYear() {
            currentYear = document.getElementById('yearSelect').value;
            renderData();
        }

        function addYear() {
            const y = prompt("Digite o ano desejado (ex: 2025 ou 2027):");
            if (y && !db[y]) {
                db[y] = {};
                months.forEach(m => db[y][m] = []);
                currentYear = y;
                saveData();
                renderYearSelect();
                renderData();
            }
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `financeiro_backup.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    db = parsed;
                    saveData();
                    renderYearSelect();
                    renderData();
                    alert("Backup importado com sucesso!");
                } catch(err) {
                    alert("Formato de arquivo JSON inválido.");
                }
            };
            reader.readAsText(file);
        }

        function toggleTheme() {
            document.body.classList.toggle('dark');
        }
    </script>
</body>
</html>
